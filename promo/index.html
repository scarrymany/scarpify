<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SCARPIFY promo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0c0c0e; overflow: hidden; }
      canvas { display: block; }
      body:not(.render) canvas { position: absolute; inset: 0; margin: auto; max-width: 100vw; max-height: 100vh; width: auto !important; height: auto !important; aspect-ratio: 16 / 9; }
      #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1.4 system-ui, sans-serif; color: #6e6e78; }
      body.render #hud { display: none; }
    </style>
  </head>
  <body>
    <div id="hud">space: play/pause · ←/→: seek 1 s · ?t=12.5 opens at a moment</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
