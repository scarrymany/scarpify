name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Service
      options:
        - YouTube Music
        - SoundCloud
        - Spotify import
        - Not related to a service
  - type: input
    id: version
    attributes:
      label: SCARPIFY version
      description: Settings, About.
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
