<svg xmlns="http://www.w3.org/2000/svg" width="880" height="318" viewBox="0 0 880 318" role="img" aria-labelledby="title desc">
  <title id="title">SCARPIFY vs Spotify: resources while playing music</title>
  <desc id="desc">CPU: SCARPIFY 1.3 percent, Spotify 2.7 percent. Memory: SCARPIFY about 240 MB, Spotify 835 MB. Measured on the same Windows 11 PC, all processes of each app included.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#f08a68"/>
      <stop offset="1" stop-color="#ec6a45"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .title { fill: #ededef; font-size: 22px; font-weight: 700; }
    .subtitle { fill: #a3a3ab; font-size: 13px; }
    .metric { fill: #ededef; font-size: 15px; font-weight: 600; }
    .app { fill: #a3a3ab; font-size: 13px; }
    .app.ours { fill: #ededef; font-weight: 600; }
    .value { fill: #a3a3ab; font-size: 14px; font-weight: 600; }
    .value.ours { fill: #ec6a45; }
    .note { fill: #6e6e78; font-size: 12px; }
  </style>

  <rect width="880" height="318" rx="18" fill="#151518"/>
  <rect x="0.5" y="0.5" width="879" height="317" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- SCARPIFY mark: three arcs on a dark circle -->
  <g transform="translate(36 30) scale(0.0469)">
    <circle cx="512" cy="512" r="464" fill="#232327"/>
    <g fill="none" stroke="#ec6a45" stroke-linecap="round">
      <path d="M262 382 C 420 322 612 330 772 410" stroke-width="76"/>
      <path d="M298 532 C 432 486 592 494 726 560" stroke-width="64"/>
      <path d="M334 670 C 444 636 572 642 680 694" stroke-width="54"/>
    </g>
  </g>
  <text class="title" x="92" y="55">Lighter than Spotify</text>
  <text class="subtitle" x="92" y="76">Same Windows 11 PC, music playing, every process of each app counted</text>

  <!-- CPU -->
  <text class="metric" x="36" y="128">CPU</text>
  <text class="app ours" x="36" y="158">SCARPIFY</text>
  <rect x="150" y="146" width="560" height="14" rx="7" fill="#232327"/>
  <rect x="150" y="146" width="272" height="14" rx="7" fill="url(#accent)"/>
  <text class="value ours" x="844" y="158" text-anchor="end">1.3%</text>
  <text class="app" x="36" y="186">Spotify</text>
  <rect x="150" y="174" width="560" height="14" rx="7" fill="#232327"/>
  <rect x="150" y="174" width="560" height="14" rx="7" fill="#55555e"/>
  <text class="value" x="844" y="186" text-anchor="end">2.7%</text>

  <!-- Memory -->
  <text class="metric" x="36" y="230">Memory</text>
  <text class="app ours" x="36" y="260">SCARPIFY</text>
  <rect x="150" y="248" width="560" height="14" rx="7" fill="#232327"/>
  <rect x="150" y="248" width="161" height="14" rx="7" fill="url(#accent)"/>
  <text class="value ours" x="844" y="260" text-anchor="end">≈ 240 MB</text>
  <text class="app" x="36" y="288">Spotify</text>
  <rect x="150" y="276" width="560" height="14" rx="7" fill="#232327"/>
  <rect x="150" y="276" width="560" height="14" rx="7" fill="#55555e"/>
  <text class="value" x="844" y="288" text-anchor="end">835 MB</text>
</svg>
